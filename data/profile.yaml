general:
  title: 
    en: "Profile"
    de: "Profil"
  content:
    en:
      - Mathematician and Data Engineer with an M.Sc. in Pure and Applied logic
        and strong interest in Human-Computer Interaction, AI systems, and evaluation 
        of LLM-based applications.
      - 6+ expertise in designing and prototyping scalable architectures for data processing,
        data pipelines, and API-based systems. Practical experience with prompt engineering, 
        LLM/AI outputs evaluation, and ethical implications of AI systems into production
        software environments.
      - Analytical, structured, and detail-oriented problem solver with a passion for learning 
        and applying new technologies with experience in interdisciplinary teams and projects, 
        and a strong commitment to ethical AI development and deployment.
    de:
      - Mathematiker und Data Engineer mit einem M.Sc. in Reiner und Angewandter Logik sowie 
        einem ausgeprägten Interesse an Mensch-Computer-Interaktion, KI-Systemen und der Evaluierung 
        von LLM-basierten Anwendungen.
      - Mehr als 6 Jahre Erfahrung in der Konzeption und Prototypenentwicklung skalierbarer 
        Architekturen für Datenverarbeitung, Datenpipelines und API-basierte Systeme. Praktische 
        Erfahrung in den Bereichen Prompt Engineering, Evaluierung von LLM-/KI-Outputs sowie den 
        ethischen Implikationen der Integration von KI-Systemen in produktive Softwareumgebungen.
      - Analytischer, strukturierter und detailorientierter Problemlöser mit einer Leidenschaft 
        für das Erlernen und Anwenden neuer Technologien; erfahren in der Arbeit in interdisziplinären 
        Teams und Projekten sowie stark engagiert für die ethische Entwicklung und Implementierung von KI.

